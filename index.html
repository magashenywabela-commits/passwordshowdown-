<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090600;--ink:#ffd98a;--dim:#b08a3e;--acc:#ffb000;--good:#5dff7a;--bad:#ff4a3d;--glass:rgba(255,176,0,.04);--line:rgba(255,176,0,.35);--mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--ink);font-family:var(--mono)}
/* CRT scanlines + vignette + flicker */
body::after{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.8) 100%);animation:flicker 6s infinite}
@keyframes flicker{0%,90%,100%{opacity:1}92%{opacity:.8}94%{opacity:1}97%{opacity:.88}}
#fx-bg{position:fixed;inset:0;z-index:0;opacity:.2}
#fx-spark{position:fixed;inset:0;z-index:5;pointer-events:none}
#app{position:relative;z-index:1;width:min(980px,100%)}

h1{margin:0 0 .6em;font-size:clamp(1.7rem,4.8vw,3.2rem);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.15;color:var(--acc);text-shadow:0 0 10px rgba(255,176,0,.65),0 0 38px rgba(255,176,0,.25)}
h1::before{content:"> ";opacity:.6}
h1::after{content:"_";margin-left:.1em;animation:blink 1s steps(1) infinite}
h2{font-size:clamp(1.3rem,3vw,2rem);margin:.4em 0;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);text-shadow:0 0 10px rgba(255,176,0,.5)}
h2::before{content:"// ";opacity:.6}
p{color:var(--dim);font-size:1rem;line-height:1.6;max-width:62ch;margin-left:auto;margin-right:auto}
@keyframes blink{50%{opacity:0}}

button{font:inherit;color:inherit;cursor:pointer}
#btn-start,#btn-next,#btn-restart{margin-top:22px;padding:12px 30px;border:2px solid var(--acc);border-radius:0;background:transparent;color:var(--acc);font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.14em;text-shadow:0 0 8px rgba(255,176,0,.6);transition:background .12s,color .12s,box-shadow .12s}
#btn-start::before,#btn-next::before,#btn-restart::before{content:"[ "}
#btn-start::after,#btn-next::after,#btn-restart::after{content:" ]"}
#btn-start:hover,#btn-next:hover,#btn-restart:hover{background:var(--acc);color:var(--bg);text-shadow:none;box-shadow:0 0 26px rgba(255,176,0,.55)}

#hud{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px dashed var(--line);color:var(--dim);font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
#hud span span{color:var(--acc);font-weight:700}

:is(.card,.option,#statement-card,#tester){position:relative;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .2s,opacity .3s}
:is(.card,.option,#statement-card,#tester)::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,176,0,.2),transparent 70%)}
:is(.card,.option,#statement-card,#tester):hover::before{opacity:1}
.card,#tester{background:var(--glass);border:1px solid var(--line);border-radius:2px}
/* corner brackets */
.card::after,#tester::after{content:"";position:absolute;inset:7px;pointer-events:none;opacity:.7;background:
 linear-gradient(var(--acc),var(--acc)) top left/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) top left/2px 14px no-repeat,
 linear-gradient(var(--acc),var(--acc)) top right/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) top right/2px 14px no-repeat,
 linear-gradient(var(--acc),var(--acc)) bottom left/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) bottom left/2px 14px no-repeat,
 linear-gradient(var(--acc),var(--acc)) bottom right/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) bottom right/2px 14px no-repeat}
.card:hover{border-color:var(--acc);box-shadow:0 0 28px rgba(255,176,0,.18)}

#arena{display:flex;align-items:stretch;gap:18px}
.card{flex:1;padding:40px 24px}
#vs{align-self:center;padding:6px 10px;border:1px solid var(--acc);color:var(--acc);font-weight:800;font-size:.95rem;letter-spacing:.12em}
.password{display:block;font:700 clamp(1rem,2.3vw,1.4rem) var(--mono);color:var(--acc);word-break:break-all;text-shadow:0 0 10px rgba(255,176,0,.5)}
.meter{height:18px;margin:24px 0 14px;padding:2px;border:1px solid var(--line)}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--bad),var(--acc),var(--good));transition:width 1.1s steps(14);-webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 13px);mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 13px)}
.crack-time{font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.crack-time::before{content:"$ ";color:var(--dim)}

#feedback{max-width:640px;margin:24px auto 0;color:var(--ink);text-align:left;border-left:3px solid var(--acc);padding-left:14px}
#feedback::before{content:"> ";color:var(--acc)}

#tester{max-width:440px;margin:26px auto;padding:26px 22px}
#tester h3{margin:0 0 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
#tester h3::before{content:"# ";opacity:.6}
#tester p{font-size:.85rem}
#tester-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:0;background:#000;color:var(--acc);font:inherit;caret-color:var(--acc)}
#tester-input::placeholder{color:var(--dim);opacity:.7}
#tester-input:focus{outline:1px solid var(--acc);box-shadow:0 0 18px rgba(255,176,0,.25)}

[data-state=winner]{border-color:var(--good)!important;animation:electric .9s ease-in-out infinite alternate}
[data-state=winner] .password{color:var(--good);text-shadow:0 0 12px rgba(93,255,122,.6)}
[data-state=loser]{border-color:var(--bad)!important;box-shadow:0 0 30px rgba(255,74,61,.3)}
[data-state=loser] .password{color:var(--bad);text-shadow:0 0 12px rgba(255,74,61,.6)}
@keyframes electric{from{box-shadow:0 0 0 1px var(--good),0 0 22px rgba(93,255,122,.3)}to{box-shadow:0 0 0 2px var(--good),0 0 50px rgba(93,255,122,.6)}}

@media(max-width:640px){#arena{flex-direction:column}#vs{margin:-4px auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">

  <section id="screen-start">
    <h1>Password Strength Showdown</h1>
    <p>Two passwords. One is stronger. Tap the one that would take longer to crack.</p>
    <button id="btn-start">Start</button>
  </section>

  <section id="screen-game" hidden>
    <header id="hud">
      <span>Round <span id="round-num">1</span> of <span id="round-total">5</span></span>
      <span>Score: <span id="score">0</span></span>
    </header>

    <div id="arena">
      <button class="card" id="card-a" data-choice="a" data-state="idle">
        <span class="password" id="pw-a"></span>
        <div class="meter"><div class="meter-fill" id="meter-a"></div></div>
        <span class="crack-time" id="crack-a" hidden></span>
      </button>

      <div id="vs">VS</div>

      <button class="card" id="card-b" data-choice="b" data-state="idle">
        <span class="password" id="pw-b"></span>
        <div class="meter"><div class="meter-fill" id="meter-b"></div></div>
        <span class="crack-time" id="crack-b" hidden></span>
      </button>
    </div>

    <p id="feedback" hidden></p>
    <button id="btn-next" hidden>Next round</button>
  </section>

  <section id="screen-end" hidden>
    <h2>Done!</h2>
    <p id="final-score"></p>

    <div id="tester">
      <h3>Test a password</h3>
      <p>Please don't type a real one. Nothing is saved or sent anywhere.</p>
      <input id="tester-input" type="text" placeholder="Try a made-up password" autocomplete="off">
      <div class="meter"><div class="meter-fill" id="tester-meter"></div></div>
      <p id="tester-label"></p>
    </div>

    <button id="btn-restart">Play again</button>
    <!-- Add your QR code image here -->
  </section>

</main>

<script>
/* Crack times are illustrative, for fun only. strength = 0-100 for the meter. */
const rounds = [
  { a:"Password123!", b:"purple-giraffe-tuba-sandwich", winner:"b", sa:8,  sb:98, ta:"Instantly", tb:"Centuries",
    tip:"Length beats cleverness. Four random words are very hard to crack." },
  { a:"Xk9#mP2$vL7!qR4", b:"Summer2024!", winner:"a", sa:96, sb:12, ta:"Centuries", tb:"Seconds",
    tip:"Predictable words and years are the first things attackers try." },
  { a:"P@ssw0rd", b:"blue-mango-rocket-77", winner:"b", sa:3, sb:85, ta:"Instantly", tb:"Many years",
    tip:"Swapping a for @ and o for 0 is a trick every cracking tool already knows." },
  { a:"correct horse battery staple", b:"Tr0ub4dor&3", winner:"a", sa:92, sb:35, ta:"Centuries", tb:"Days",
    tip:"A long passphrase is stronger and easier to remember." },
  { a:"qwerty123456", b:"Moon-Pizza-Laser-Tiger-9", winner:"b", sa:2, sb:97, ta:"Instantly", tb:"Centuries",
    tip:"Keyboard patterns are among the most common passwords in the world." }
];

const $ = id => document.getElementById(id);
let index = 0, score = 0, locked = false;

function show(screen){
  ["screen-start","screen-game","screen-end"].forEach(s => $(s).hidden = (s !== screen));
}

function loadRound(){
  const r = rounds[index];
  locked = false;
  $("round-num").textContent = index + 1;
  $("round-total").textContent = rounds.length;
  $("score").textContent = score;
  ["a","b"].forEach(k => {
    $("pw-"+k).textContent = r[k];
    $("meter-"+k).style.width = "0%";
    $("crack-"+k).hidden = true;
    $("card-"+k).dataset.state = "idle";
  });
  $("feedback").hidden = true;
  $("btn-next").hidden = true;
}

function choose(choice){
  if (locked) return;
  locked = true;
  const r = rounds[index];
  const correct = choice === r.winner;
  if (correct) score++;
  $("score").textContent = score;

  ["a","b"].forEach(k => {
    $("meter-"+k).style.width = r["s"+k] + "%";   // animate this with GSAP later
    $("crack-"+k).textContent = "Cracked in: " + r["t"+k];
    $("crack-"+k).hidden = false;
    $("card-"+k).dataset.state = (k === r.winner) ? "winner" : "loser";
  });
  $("feedback").textContent = (correct ? "Correct! " : "Not quite. ") + r.tip;
  $("feedback").hidden = false;
  $("btn-next").hidden = false;
  $("btn-next").textContent = (index === rounds.length - 1) ? "See results" : "Next round";
}

function next(){
  index++;
  if (index >= rounds.length){
    $("final-score").textContent = "You got " + score + " out of " + rounds.length + ".";
    show("screen-end");
  } else loadRound();
}

function restart(){ index = 0; score = 0; loadRound(); show("screen-game"); }

/* Simple fun estimate, not a real security tool */
function estimate(pw){
  if (!pw) return { pct:0, label:"" };
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  const bits = pw.length * Math.log2(pool);
  const pct = Math.min(100, Math.round(bits / 80 * 100));
  const label = pct < 25 ? "Very weak" : pct < 50 ? "Weak" : pct < 75 ? "Decent" : "Strong";
  return { pct, label };
}

$("btn-start").addEventListener("click", restart);
$("btn-restart").addEventListener("click", restart);
$("btn-next").addEventListener("click", next);
$("card-a").addEventListener("click", () => choose("a"));
$("card-b").addEventListener("click", () => choose("b"));
$("tester-input").addEventListener("input", e => {
  const { pct, label } = estimate(e.target.value);
  $("tester-meter").style.width = pct + "%";
  $("tester-label").textContent = label;
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* Shared effects. Reads the games' existing ids/classes/data-state, so game logic is untouched.
   Plain JS recreations of: LetterGlitch, ClickSpark, SpotlightCard, TiltedCard, DecryptedText, CountUp. */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasGsap = () => !!window.gsap && !reduce;

  const acc = '#ffb000';

  /* ---- LetterGlitch background (low cost: only ~40 cells change per tick) ---- */
  const bg = document.createElement('canvas');
  bg.id = 'fx-bg';
  document.body.prepend(bg);
  const g = bg.getContext('2d'), size = 18, chars = '01010101ABCDEF<>/\\|{}[]#$%';
  let cols, grid;
  const rnd = () => chars[Math.random() * chars.length | 0];
  const cell = i => {
    const x = (i % cols) * size, y = (i / cols | 0) * size;
    g.clearRect(x, y, size, size);
    g.globalAlpha = grid[i].a; g.fillStyle = acc;
    g.fillText(grid[i].c, x + 2, y + size - 4);
  };
  function initBg() {
    bg.width = innerWidth; bg.height = innerHeight;
    cols = Math.ceil(bg.width / size);
    grid = Array.from({ length: cols * Math.ceil(bg.height / size) }, () => ({ c: rnd(), a: Math.random() * .7 }));
    g.font = (size - 4) + 'px monospace';
    grid.forEach((_, i) => cell(i));
  }
  initBg(); addEventListener('resize', initBg);
  if (!reduce) setInterval(() => {
    for (let n = 0; n < 40; n++) { const i = Math.random() * grid.length | 0; grid[i] = { c: rnd(), a: Math.random() * .7 }; cell(i); }
  }, 60);

  /* ---- ClickSpark ---- */
  const sp = document.createElement('canvas');
  sp.id = 'fx-spark'; document.body.append(sp);
  const sc = sp.getContext('2d'); let sparks = [];
  const SC = ['#ffb000','#ffd98a'], SN = 8;
  const sizeSp = () => { sp.width = innerWidth; sp.height = innerHeight; };
  sizeSp(); addEventListener('resize', sizeSp);
  addEventListener('pointerdown', e => {
    const t = performance.now();
    for (let i = 0; i < SN; i++) sparks.push({ x: e.clientX, y: e.clientY, a: Math.PI * 2 * i / SN, t, c: SC[i % SC.length] });
  });
  (function loop(t) {
    sc.clearRect(0, 0, sp.width, sp.height);
    sparks = sparks.filter(s => t - s.t < 450);
    sc.lineWidth = 2; sc.lineCap = 'round';
    sparks.forEach(s => {
      const p = (t - s.t) / 450, d = 14 * (1 - (1 - p) * (1 - p)), l = 10 * (1 - p);
      sc.strokeStyle = s.c;
      sc.beginPath();
      sc.moveTo(s.x + Math.cos(s.a) * d, s.y + Math.sin(s.a) * d);
      sc.lineTo(s.x + Math.cos(s.a) * (d + l), s.y + Math.sin(s.a) * (d + l));
      sc.stroke();
    });
    requestAnimationFrame(loop);
  })(performance.now());

  /* ---- Spotlight + Tilt on cards (delegated, so generated options work too) ---- */
  const CARD = '.card,.option,#statement-card,#tester';
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest(CARD);
    if (!c) return;
    const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    c.style.setProperty('--mx', x + 'px'); c.style.setProperty('--my', y + 'px');
    if (!reduce && 0 && c.id !== 'tester')
      c.style.transform = `perspective(700px) rotateX(${-(y / r.height - .5) * 0}deg) rotateY(${(x / r.width - .5) * 0}deg) scale(1)`;
  });
  document.addEventListener('pointerout', e => {
    const c = e.target.closest && e.target.closest(CARD);
    if (c && !c.contains(e.relatedTarget)) c.style.transform = '';
  });

  /* ---- DecryptedText ---- */
  const pool = '01<>/\|{}[]#$%&';
  function decrypt(el, ms = 650) {
    const text = el.textContent, n = text.length;
    el._last = text;
    if (reduce || !n) return;
    el._busy = true;
    const t0 = performance.now();
    (function f(t) {
      const p = Math.min(1, (t - t0) / ms), k = Math.floor(p * n);
      el.textContent = text.slice(0, k) + [...text.slice(k)].map(c => c === ' ' ? c : pool[Math.random() * pool.length | 0]).join('');
      if (p < 1) requestAnimationFrame(f); else { el.textContent = text; el._busy = false; }
    })(t0);
  }
  /* Decrypt whenever the game writes new text into these elements */
  const watch = el => new MutationObserver(() => {
    if (el._busy || el.textContent === el._last) return;
    decrypt(el);
  }).observe(el, { childList: true, characterData: true });
  ['.password', '#statement', '#feedback', '#reveal', '#fact', '#final-score', '#best-streak'].forEach(s => $$(s).forEach(watch));

  /* ---- CountUp on the score ---- */
  const score = $('#score');
  if (score) {
    score._v = 0;
    new MutationObserver(() => {
      const to = +score.textContent;
      if (score._busy || to === score._v) return;
      const from = score._v, t0 = performance.now();
      score._busy = true;
      (function f(t) {
        const p = Math.min(1, (t - t0) / 400);
        score.textContent = Math.round(from + (to - from) * p);
        if (p < 1) requestAnimationFrame(f); else { score._v = to; score._busy = false; }
      })(t0);
    }).observe(score, { childList: true, characterData: true });
  }

  /* ---- GSAP: screen transitions + answer feedback ---- */
  $$('section').forEach(s => new MutationObserver(() => {
    if (s.hidden) return;
    $$('h1,h2', s).forEach(h => decrypt(h));
    if (hasGsap()) gsap.from(s, { opacity: 0, duration: .5, ease: 'steps(7)', clearProps: 'all' });
  }).observe(s, { attributes: true, attributeFilter: ['hidden'] }));
  $$('#screen-start h1').forEach(h => decrypt(h));

  new MutationObserver(list => list.forEach(m => {
    if (!hasGsap()) return;
    const el = m.target, s = el.dataset.state;
    if (s === 'wrong' || s === 'loser') gsap.fromTo(el, { x: -10 }, { x: 0, duration: .5, ease: 'elastic.out(1,.3)', clearProps: 'x' });
    if (s === 'correct' || s === 'winner') gsap.fromTo(el, { scale: .94 }, { scale: 1, duration: .6, ease: 'back.out(2)', clearProps: 'scale' });
  })).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['data-state'] });
})();

</script>
</body>
</html>
